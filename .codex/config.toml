#:schema https://developers.openai.com/codex/config-schema.json
model = "gpt-6-sol"
model_reasoning_effort = "xhigh"
web_search = "live"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"


notify = ["/Users/grojas/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
service_tier = "default"

[sandbox_workspace_write]
network_access = true

[features]
context_management.experimental_mode = true
memories = false
prevent_idle_sleep = true
js_repl = false
default_mode_request_user_input = true

[memories]
generate_memories = false
use_memories = false

[agents]
max_concurrent_threads_per_session = 40
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"

[mcp_servers.zf-grafana-prod]
url = "https://mcp.nixhoodwink.com/grafana/mcp"

[mcp_servers.zf-grafana-stag]
url = "https://mcp-stag.nixhoodwink.com/grafana/mcp"

[mcp_servers.zf-grafana-qa]
url = "https://mcp-qa.nixhoodwink.com/grafana/mcp"

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "context-window-size"]

[[skills.config]]
path = "/Users/grojas/.codex/skills/codex-primary-runtime/slides/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/grojas/.codex/skills/.system/imagegen/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/grojas/.codex/skills/.system/openai-docs/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/grojas/.codex/skills/.system/plugin-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/grojas/.codex/skills/.system/skill-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/grojas/.codex/skills/.system/skill-installer/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/grojas/.codex/skills/codex-primary-runtime/spreadsheets/SKILL.md"
enabled = false

[[skills.config]]
path = "/Users/grojas/.codex/skills/chronicle/SKILL.md"
enabled = false

[desktop]
sansFontSize = 14
codeFontSize = 12
followUpQueueMode = "queue"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-branch-prefix = ""
git-pull-request-merge-method = "squash"
git-commit-instructions = ""
git-pr-instructions = ""
conversationDetailMode = "STEPS_COMMANDS"
worktree-keep-count = 50
ambient-suggestions-enabled = true
show-context-window-usage = true
reviewDelivery = "inline"
mac-menu-bar-enabled = false
dock-icon-preference = "app-default"
open-local-url-in-target-preference = "external-browser"

[desktop.open-in-target-preferences]
global = "vscode"

[desktop.open-in-target-preferences.perPath]
"/Users/grojas/Library/CloudStorage/GoogleDrive-grojas@zerofox.com/My Drive/obsidian/brain" = "vscode"

[desktop.appearanceLightChromeTheme]
accent = "#339cff"
contrast = 45
ink = "#1a1c1f"
opaqueWindows = true
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#ba2623"
skill = "#924ff7"

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
contrast = 60
ink = "#ffffff"
opaqueWindows = true
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[apps.connector_openai_hotline]
enabled = false
