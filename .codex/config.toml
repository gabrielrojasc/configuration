#:schema https://developers.openai.com/codex/config-schema.json
model = "gpt-6-astra"
model_reasoning_effort = "high"
web_search = "live"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"


notify = ["/Users/grojas/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
service_tier = "default"

[sandbox_workspace_write]
network_access = true

[features]
unified_exec = true
apply_patch_freeform = true
shell_snapshot = true
multi_agent = true
memories = false
chronicle = false
guardian_approval = true
prevent_idle_sleep = true
goals = true
js_repl = false
default_mode_request_user_input = true

[memories]
generate_memories = false
use_memories = false

[mcp_servers.zf-grafana-prod]
url = "https://mcp.nixhoodwink.com/grafana/mcp"

[mcp_servers.zf-grafana-stag]
url = "https://mcp-stag.nixhoodwink.com/grafana/mcp"

[mcp_servers.zf-grafana-qa]
url = "https://mcp-qa.nixhoodwink.com/grafana/mcp"

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/grojas/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/grojas/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
